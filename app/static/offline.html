<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Оффлайн режим | FamilyBook</title>
    <style>
        :root {
            --brand: #d4af37;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            box-sizing: border-box;
            padding: 24px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #0f172a;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 14px 28px;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(0.95); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Нет подключения к сети</h1>
        <p>Вы находитесь в автономном режиме. FamilyBook сохранит ваши данные локально и обновит ленту, как только появится интернет.</p>
        <button class="btn" onclick="window.location.reload()">Обновить страницу</button>
    </div>
</body>
</html>
