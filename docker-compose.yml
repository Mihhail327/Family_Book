networks:
  frontend:
    driver: bridge
  backend:
    internal: true  # Полностью изолированная сеть для Redis и внутренней бизнес-логики

volumes:
  sqlite_data:      # Именованный том для персистентности файла БД SQLite
  app_logs:         # Именованный том для ротируемых логов приложения

services:
  web:
    build: .
    restart: always
    env_file:
      - .env.prod
    environment:
      - SQLITE_BUSY_TIMEOUT=5000  # Таймаут ожидания разблокировки DB в мс
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./family_book.db:/app/family_book.db
      - ./app/static/uploads:/app/app/static/uploads
      - ./logs:/app/app/logs
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    depends_on:
      - redis

  nginx:
    image: nginx:1.25.4-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7.2.4-alpine
    restart: always
    networks:
      - backend

  celery_worker:
    build: .
    command: >
      celery -A app.core.celery_app.celery_instance worker 
      --loglevel=info 
      --concurrency=1 
      --max-tasks-per-child=5
    restart: always
    env_file:
      - .env.prod
    environment:
      - SQLITE_BUSY_TIMEOUT=5000
    volumes:
      - ./family_book.db:/app/family_book.db
      - ./app/static/uploads:/app/app/static/uploads
      - ./logs:/app/app/logs
    networks:
      - backend
    depends_on:
      - redis
